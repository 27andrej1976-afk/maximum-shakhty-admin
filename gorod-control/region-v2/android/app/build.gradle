plugins { id 'com.android.application' }
android {
  namespace 'ru.citycontrol.don'
  compileSdk 35
  buildFeatures { buildConfig true }
  defaultConfig {
    applicationId 'ru.citycontrol.don'
    minSdk 26
    targetSdk 35
    versionCode (findProperty("donVersionCode") ?: "2").toInteger()
    versionName '0.2.0-pilot'
    buildConfigField 'String', 'RUSTORE_PROJECT_ID', '"' + (findProperty('rustoreProjectId') ?: '').replaceAll('[^A-Za-z0-9_-]', '') + '"'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  buildTypes {
    pilot { initWith release; signingConfig null; matchingFallbacks = ['release']; debuggable false }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies {
  implementation 'ru.rustore.sdk:pushclient:7.5.0'
  implementation 'androidx.webkit:webkit:1.12.1'
  androidTestImplementation 'androidx.test:core:1.6.1'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// This build is a QA preview, not a RuStore release. Never sign it with a
// temporary/debug key and publish it as the permanent regional application.
tasks.configureEach { task ->
  if (task.name == 'preReleaseBuild') {
    task.doFirst {
      throw new GradleException('Regional release gate is not complete: verify live coverage, legal operator, Android acceptance and permanent backed-up signing key before enabling release builds.')
    }
  }
}
