# Add only inside the verified existing HTTPS server block, after backing up
# its configuration. No new server/domain or changes to the site's root route.
location /don-control/ {
    proxy_pass http://127.0.0.1:8791/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
