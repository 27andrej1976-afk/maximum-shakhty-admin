name: City Control | Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gorod-control/android/**'
      - '.github/workflows/gorod-apk.yml'
permissions:
  contents: write
concurrency:
  group: gorod-control-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android test APK
        working-directory: gorod-control/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish downloadable APK
        run: |
          mkdir -p gorod-control/downloads
          cp gorod-control/android/app/build/outputs/apk/debug/app-debug.apk gorod-control/downloads/GorodPodKontrolem-Shakhty-test.apk
          (cd gorod-control/downloads && sha256sum GorodPodKontrolem-Shakhty-test.apk > SHA256SUMS.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gorod-control/downloads
          if ! git diff --cached --quiet; then
            git commit -m 'city-control: publish Android test APK'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gorod-control-shakhty-test-apk
          path: gorod-control/downloads/GorodPodKontrolem-Shakhty-test.apk
