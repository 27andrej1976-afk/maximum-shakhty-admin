name: City Control | Isolated Yandex Maps beta
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gorod-control/yandex-v1/yandex-bridge.js'
      - 'gorod-control/yandex-v1/yandex.css'
      - 'gorod-control/yandex-v1/build_preview.py'
      - 'gorod-control/yandex-v1/test_browser.py'
      - 'gorod-control/yandex-v1/README.md'
permissions:
  contents: write
concurrency:
  group: city-yandex-beta-build
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated preview and validate JavaScript syntax
        run: |
          python gorod-control/yandex-v1/build_preview.py
          node --check gorod-control/yandex-v1/yandex-bridge.js
          python - <<'PY'
          from pathlib import Path
          s=Path('gorod-control/yandex-v1/index.html').read_text()
          assert 'CityYandexV1.startWithFallback' in s
          assert 'https://api-maps.yandex.ru/v3/?apikey=' in Path('gorod-control/yandex-v1/yandex-bridge.js').read_text()
          assert 'YOUR_API_KEY' not in s
          print('Yandex beta contains only a runtime key entry, never a user key')
          PY
      - name: Install headless browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Test mobile UI both in fallback and mocked Yandex API
        run: python gorod-control/yandex-v1/test_browser.py
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: city-yandex-beta-browser-report
          path: gorod-control/yandex-v1/test-report/
          if-no-files-found: error
      - name: Publish only beta preview, never the live application
        run: |
          set -euo pipefail
          cp gorod-control/yandex-v1/index.html /tmp/yandex-beta-index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore gorod-control/yandex-v1/index.html || true
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -f -B yandex-beta-publish origin/main
            mkdir -p gorod-control/yandex-v1
            cp /tmp/yandex-beta-index.html gorod-control/yandex-v1/index.html
            git add gorod-control/yandex-v1/index.html
            if git diff --cached --quiet; then echo 'Preview already current'; break; fi
            git commit -m 'City Control: publish isolated Yandex Maps preview without user API key'
            if git push origin HEAD:main; then echo 'YANDEX BETA PREVIEW PUBLISHED'; break; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep 3
          done
  apk:
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore validated v0.8 source normalizer
        run: |
          git fetch --no-tags --depth=1 origin city-sources-v08
          mkdir -p gorod-control/source-lab-v08
          git show FETCH_HEAD:gorod-control/source-lab-v08/water_verified.py > gorod-control/source-lab-v08/water_verified.py
          test "$(git hash-object gorod-control/source-lab-v08/water_verified.py)" = a62034202ed9c17c0d7fff05dca533146389b735
      - name: Prepare stable 0.9 app + Shakhty coat icon
        run: |
          python gorod-control/direct-v09/prepare.py
          python -m pip install --quiet pillow
          python gorod-control/direct-v09/build_coat_icon.py
          python - <<'PY'
          from pathlib import Path
          import re
          ROOT=Path('gorod-control/android/app')
          grad=ROOT/'build.gradle'
          s=grad.read_text()
          assert "applicationId 'ru.citycontrol.shakhty.beta'" in s
          s=s.replace("applicationId 'ru.citycontrol.shakhty.beta'","applicationId 'ru.citycontrol.shakhty.yandexbeta'")
          s=re.sub(r'versionCode \d+','versionCode 11',s)
          s=re.sub(r"versionName '[^']+'","versionName '1.0.0-yandex-beta'",s)
          grad.write_text(s)
          manifest=ROOT/'src/main/AndroidManifest.xml'
          s=manifest.read_text().replace('android:label="Город · тест 0.9"','android:label="Город · Яндекс тест"')
          manifest.write_text(s)
          main=ROOT/'src/main/java/ru/citycontrol/shakhty/MainActivity.java'
          s=main.read_text()
          old='"https://27andrej1976-afk.github.io/maximum-shakhty-admin/gorod-control/"'
          assert old in s
          s=s.replace(old,'"https://27andrej1976-afk.github.io/maximum-shakhty-admin/gorod-control/yandex-v1/"',1)
          main.write_text(s)
          print('Standalone Yandex beta APK ready to compile; no key bundled')
          PY
      - name: Build Android test APK
        working-directory: gorod-control/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify Yandex beta package, coat icon and APK signature
        run: |
          set -euo pipefail
          APK=gorod-control/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ru.citycontrol.shakhty.yandexbeta'"
          unzip -l "$APK" | grep 'res/drawable-nodpi-v4/coat_launcher.png'
          mkdir -p /tmp/yandex-beta-apk
          cp "$APK" /tmp/yandex-beta-apk/GorodPodKontrolem-Shakhty-Yandex-1.0-beta.apk
          sha256sum /tmp/yandex-beta-apk/*.apk
      - name: Publish only separate beta APK
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -f -B yandex-beta-apk-publish origin/main
            mkdir -p gorod-control/yandex-v1/downloads
            cp /tmp/yandex-beta-apk/*.apk gorod-control/yandex-v1/downloads/
            git add gorod-control/yandex-v1/downloads/GorodPodKontrolem-Shakhty-Yandex-1.0-beta.apk
            if git diff --cached --quiet; then echo 'Beta APK already published'; break; fi
            git commit -m 'City Control: publish isolated Yandex Maps beta APK'
            if git push origin HEAD:main; then echo 'YANDEX BETA APK PUBLISHED'; break; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep 3
          done
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: city-yandex-beta-installable-apk
          path: /tmp/yandex-beta-apk/*.apk
          if-no-files-found: error
