name: City Control | Retire ordinary app downloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gorod-compact-cleanup.yml']
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const retired = new Set([
              '.github/workflows/gorod-apk.yml',
              '.github/workflows/gorod-v091-icon-apk.yml',
              '.github/workflows/gorod-v09-device-test.yml',
              '.github/workflows/gorod-yandex-beta.yml',
              '.github/workflows/gorod-two-report-apks-v15.yml'
            ]);
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {...repo, per_page: 100});
            let disabled = 0, deleted = 0;
            for (const w of workflows) {
              if (retired.has(w.path) && w.state === 'active') {
                await github.rest.actions.disableWorkflow({...repo, workflow_id: w.id});
                core.info(`Disabled retired workflow ${w.path}`); disabled++;
              }
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...repo, per_page: 100});
            const runs = new Map();
            for (const a of artifacts) {
              let remove = /^report-apk-normal-/.test(a.name);
              if (!remove && a.workflow_run?.id && !/compact/i.test(a.name)) {
                const id = a.workflow_run.id;
                if (!runs.has(id)) runs.set(id, (await github.rest.actions.getWorkflowRun({...repo, run_id: id})).data.path);
                remove = retired.has(runs.get(id)) && runs.get(id) !== '.github/workflows/gorod-two-report-apks-v15.yml';
              }
              if (remove) {
                await github.rest.actions.deleteArtifact({...repo, artifact_id: a.id});
                core.info(`Deleted ordinary-app artifact ${a.name}`); deleted++;
              }
            }
            await core.summary.addRaw(`Retired workflows disabled: ${disabled}. Ordinary-app artifacts deleted: ${deleted}. Compact artifacts retained.`).write();
