name: City Control | Direct live feed v0.9
on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gorod-v09-live.yml'
      - 'gorod-control/direct-v09/*.py'
      - 'gorod-control/scripts/**'
permissions:
  contents: write
concurrency:
  group: city-direct-live-v09
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read direct official graph and preserve individual source timestamps
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CITY_CHAT_ID: ${{ vars.MAX_CITY_CHAT_ID }}
          MAX_POWER_CHAT_ID: ${{ vars.MAX_POWER_CHAT_ID }}
        run: |
          python -m compileall -q gorod-control/direct-v09
          python gorod-control/scripts/collect_water.py
          python gorod-control/scripts/collect_services.py
          python gorod-control/direct-v09/build_feed.py
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('gorod-control/direct-v09/feed.json').read_text())
          assert d['schema']==2 and d['coverage']=='partial'
          required={'city','water_kvu','repost_rostov','repost_don','power_direct','power_city','gas_city','gas','mchs'}
          assert required.issubset({s['id'] for s in d['sources']}), 'Incomplete source registry'
          for e in d['events']:
            if e.get('sourceId')=='power_direct':
              assert e['url']=='https://donenergo.ru/grafik-otklyucheniy/61/1/'
              assert e['origin']=='official_site'
              assert e['publishedAt'] is None
          print('Independent feed checked',d['checkedAt'])
          PY
      - name: Publish only refreshed v0.9 data, never old app or APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/direct-live-ready
          for file in feed.json map-geometry.json street-geometry.json; do
            cp "gorod-control/direct-v09/$file" "/tmp/direct-live-ready/$file"
          done
          BUILT_WATER_SHA=$(git rev-parse HEAD:gorod-control/direct-v09/water_verified.py)
          BUILT_SCRIPTS_SHA=$(git rev-parse HEAD:gorod-control/scripts)
          git restore gorod-control/direct-v09 gorod-control/data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$BUILT_WATER_SHA" != "$(git rev-parse origin/main:gorod-control/direct-v09/water_verified.py)" ] || [ "$BUILT_SCRIPTS_SHA" != "$(git rev-parse origin/main:gorod-control/scripts)" ]; then exit 0; fi
            git checkout -B direct-live-publish origin/main
            cp /tmp/direct-live-ready/*.json gorod-control/direct-v09/
            git add gorod-control/direct-v09/feed.json gorod-control/direct-v09/map-geometry.json gorod-control/direct-v09/street-geometry.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'City Control: refresh direct official v0.9 notices and street geometry'
            if git push origin HEAD:main; then echo 'DIRECT LIVE FEED UPDATED'; break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 2
          done
