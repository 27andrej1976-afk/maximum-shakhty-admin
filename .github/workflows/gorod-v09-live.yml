name: City Control | Direct live feed v0.9
on:
  workflow_dispatch:
  # Schedules can be delayed by Actions; follow each successful baseline read
  # as well. This trigger becomes active only after reviewed publication to main.
  workflow_run:
    workflows: ['City Control | Shakhty Water Notices']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '3,18,33,48 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gorod-v09-live.yml'
      - 'gorod-control/direct-v09/*.py'
      - 'gorod-control/scripts/**'
permissions:
  contents: write
concurrency:
  group: city-direct-live-v09
  cancel-in-progress: false
jobs:
  refresh:
    # Never execute branch/fork code with live-source secrets or publish rights.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional MAX user reader only when configured
        env:
          MAX_USER_SESSION_B64: ${{ secrets.MAX_USER_SESSION_B64 }}
        run: |
          if [ -n "$MAX_USER_SESSION_B64" ]; then python -m pip install --quiet -r gorod-control/max-reader/requirements.txt; fi
      - name: Read direct official graph and preserve individual source timestamps
        env:
          MAX_USER_SESSION_B64: ${{ secrets.MAX_USER_SESSION_B64 }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CITY_CHAT_ID: ${{ vars.MAX_CITY_CHAT_ID }}
          MAX_POWER_CHAT_ID: ${{ vars.MAX_POWER_CHAT_ID }}
        run: |
          python -m unittest discover -s gorod-control/scripts -p 'test_*.py' -q
          python -m compileall -q gorod-control/direct-v09
          # A completed baseline run has already published its checked data.
          # Independently scheduled/manual runs still perform their own read.
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            python gorod-control/scripts/collect_water.py
            python gorod-control/scripts/collect_services.py
          fi
          python gorod-control/direct-v09/build_feed.py
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('gorod-control/direct-v09/feed.json').read_text())
          assert d['schema']==2 and d['coverage']=='partial'
          required={'city','water_kvu','repost_rostov','repost_don','power_direct','power_city','gas_city','gas','mchs','power_repost_don','power_repost_rostov','max_city','max_power'}
          assert required.issubset({s['id'] for s in d['sources']}), 'Incomplete source registry'
          for e in d['events']:
            if e.get('sourceId')=='power_direct':
              assert e['url']=='https://donenergo.ru/grafik-otklyucheniy/61/1/'
              assert e['origin']=='official_site'
              assert e['publishedAt'] is None
          print('Independent feed checked',d['checkedAt'])
          PY
      - name: Publish only refreshed v0.9 data, never old app or APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/direct-live-ready
          for file in feed.json map-geometry.json street-geometry.json power-cache.json max-public.json; do
            cp "gorod-control/direct-v09/$file" "/tmp/direct-live-ready/$file"
          done
          BUILT_CODE_SHA=$(git ls-tree -r HEAD gorod-control/direct-v09/ | grep '\.py$' | sha256sum)
          BUILT_SCRIPTS_SHA=$(git rev-parse HEAD:gorod-control/scripts)
          git restore gorod-control/direct-v09 gorod-control/data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$BUILT_CODE_SHA" != "$(git ls-tree -r origin/main gorod-control/direct-v09/ | grep '\.py$' | sha256sum)" ] || [ "$BUILT_SCRIPTS_SHA" != "$(git rev-parse origin/main:gorod-control/scripts)" ]; then exit 0; fi
            git checkout -B direct-live-publish origin/main
            cp /tmp/direct-live-ready/*.json gorod-control/direct-v09/
            git add gorod-control/direct-v09/max-public.json gorod-control/direct-v09/power-cache.json gorod-control/direct-v09/feed.json gorod-control/direct-v09/map-geometry.json gorod-control/direct-v09/street-geometry.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'City Control: refresh direct official v0.9 notices and street geometry'
            if git push origin HEAD:main; then echo 'DIRECT LIVE FEED UPDATED'; break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 2
          done
