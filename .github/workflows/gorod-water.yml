name: City Control | Shakhty Water Notices
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'gorod-control/scripts/**'
      - '.github/workflows/gorod-water.yml'
permissions:
  contents: write
concurrency:
  group: gorod-control-water
  cancel-in-progress: false
jobs:
  update-water:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser including address and restoration
        run: python -m unittest discover -s gorod-control/scripts -p 'test_*.py' -v
      - name: Fetch public Shakhty water notices
        run: python gorod-control/scripts/collect_water.py
      - name: Test publicly accessible official repost feeds
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          import re
          urls=[
           'https://newsrostov.ru/rss.xml',
           'https://newsrostov.ru/rss',
           'https://newsrostov.ru/feed',
           'https://newsrostov.ru/society/2026/10/16/597700.html',
           'https://news-don.ru/rss.xml',
           'https://news-don.ru/society/2026/10/17/147188.html',
           'https://max.ru/shakhtygorod',
           'https://max.ru/guproursv'
          ]
          for u in urls:
           try:
            with urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0 (compatible; CityControlTest/0.2; +https://github.com/27andrej1976-afk/maximum-shakhty-admin)'}), timeout=8) as r:
             b=r.read(200000)
             x=b.decode('utf-8','replace')
             print('FEED_CHECK',u,'HTTP',r.status,'BYTES',len(b),'CTYPE',r.headers.get('Content-Type'),'water',len(re.findall('водоснабж|Шахтинск|Шахты',x,re.I)),'RSS',('<rss' in x or '<feed' in x))
           except Exception as e:
            print('FEED_CHECK',u,'FAILED',str(e)[:120])
          PY
      - name: Publish JSON to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gorod-control/data/water.json
          if ! git diff --cached --quiet; then
            git commit -m 'city-control: refresh water notices'
            git push origin HEAD:main
          fi
