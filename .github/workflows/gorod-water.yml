name: City Control | Shakhty Water Notices
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'gorod-control/scripts/**'
      - '.github/workflows/gorod-water.yml'
permissions:
  contents: write
concurrency:
  group: gorod-control-water
  cancel-in-progress: false
jobs:
  update-water:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser including address and restoration
        run: python -m unittest discover -s gorod-control/scripts -p 'test_*.py' -v
      - name: Fetch public Shakhty water notices
        run: python gorod-control/scripts/collect_water.py
      - name: Inspect full RSS description and source tags
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from xml.etree import ElementTree as ET
          u='https://newsrostov.ru/rss.xml'
          with urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=18) as r: root=ET.fromstring(r.read(6000000))
          for item in root.findall('.//item'):
            title=item.findtext('title') or ''
            if 'Шахтинский' in title:
              a=item.findtext('{http://purl.org/rss/1.0/modules/content/}encoded') or ''
              b=item.findtext('description') or ''
              print('RSS_CONTENT_SAMPLE',repr(a[:2300]))
              print('RSS_DESC_SAMPLE',repr(b[:1000]))
              print('RSS_TAIL',repr(a[-500:]))
              break
          PY
      - name: Validate mobile app JavaScript
        run: |
          python - <<'PY'
          import re,subprocess,pathlib,tempfile
          html=pathlib.Path('gorod-control/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s+[^>]*)?>(.*?)</script>',html,re.S|re.I)
          if len(scripts)<2:raise SystemExit('Expected inline logic and frontend scripts')
          for i,s in enumerate(scripts):
            with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as t:
              t.write(s);fn=t.name
            proc=subprocess.run(['node','--check',fn],capture_output=True,text=True)
            if proc.returncode:raise SystemExit('JavaScript '+str(i)+' invalid: '+proc.stderr)
          print('JavaScript source syntax OK:',len(scripts),'scripts')
          PY
      - name: Publish JSON to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gorod-control/data/water.json
          if ! git diff --cached --quiet; then
            git commit -m 'city-control: refresh water notices'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 3
            done
          fi
