name: City Control | Shakhty Water Notices
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'gorod-control/scripts/**'
      - '.github/workflows/gorod-water.yml'
permissions:
  contents: write
concurrency:
  group: gorod-control-water
  cancel-in-progress: false
jobs:
  update-water:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser including address and restoration
        run: python -m unittest discover -s gorod-control/scripts -p 'test_*.py' -v
      - name: Fetch public Shakhty water notices
        run: python gorod-control/scripts/collect_water.py
      - name: Diagnose newer official municipal sources
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          urls=[
            'https://rovodokanal.ru/emergency-alerts/',
            'https://rovodokanal.ru/emergency-alerts/1591',
            'https://max.ru/guproursv.ru',
            'https://news-don.ru/society/2026/10/17/147188.html'
          ]
          for url in urls:
            try:
              req=Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
              with urlopen(req,timeout=8) as r:
                data=r.read(400).decode('utf-8','replace')
                print(url,'HTTP',r.status,'type',r.headers.get('Content-Type'),'peek',data[:100].replace('\\n',' '))
            except Exception as e:
              print(url,'unavailable:',str(e)[:120])
          PY
      - name: Publish JSON to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gorod-control/data/water.json
          if ! git diff --cached --quiet; then
            git commit -m 'city-control: refresh water notices'
            git push origin HEAD:main
          fi
