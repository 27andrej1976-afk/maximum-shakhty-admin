name: City Control | Shakhty Water Notices
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'gorod-control/scripts/**'
      - '.github/workflows/gorod-water.yml'
permissions:
  contents: write
concurrency:
  group: gorod-control-water
  cancel-in-progress: false
jobs:
  update-water:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser including address and restoration
        run: python -m unittest discover -s gorod-control/scripts -p 'test_*.py' -v
      - name: Fetch public Shakhty water notices
        run: python gorod-control/scripts/collect_water.py
      - name: Inspect water posts in current municipal channels
        run: |
          python - <<'PY'
          import re,html
          from urllib.request import Request,urlopen
          for ch in ['admshakhty','stopshahty']:
            try:
              with urlopen(Request('https://t.me/s/'+ch,headers={'User-Agent':'Mozilla/5.0'}),timeout=12) as r:
                page=r.read(1800000).decode('utf-8','replace')
              for block in re.split(r'<div class="tgme_widget_message_wrap',page)[1:]:
                m=re.search(r'data-post="([^"]+)"',block)
                t=re.search(r'<time[^>]+datetime="([^"]+)"',block)
                b=re.search(r'<div[^>]*class="[^"]*tgme_widget_message_text[^"]*"[^>]*>(.*?)</div>',block,re.S)
                if not (m and t and b):continue
                raw=re.sub(r'<br\\s*/?>',' | ',b.group(1),flags=re.I)
                line=html.unescape(re.sub('<[^>]+>',' ',raw))
                if re.search('водоснаб|водоканал|снижено давление|УРСВ|отключени[ея] воды',line,re.I):
                  print('NOTICE',ch,m.group(1),t.group(1),re.sub(r'\\s+',' ',line)[:280])
            except Exception as e:print('SOURCE ERROR',ch,str(e)[:100])
          PY
      - name: Publish JSON to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gorod-control/data/water.json
          if ! git diff --cached --quiet; then
            git commit -m 'city-control: refresh water notices'
            git push origin HEAD:main
          fi
