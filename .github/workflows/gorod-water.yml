name: City Control | Shakhty Water Notices
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'gorod-control/scripts/**'
      - '.github/workflows/gorod-water.yml'
permissions:
  contents: write
concurrency:
  group: gorod-control-water
  cancel-in-progress: false
jobs:
  update-water:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser including address and restoration
        run: python -m unittest discover -s gorod-control/scripts -p 'test_*.py' -v
      - name: Fetch public Shakhty water notices
        run: python gorod-control/scripts/collect_water.py
      - name: Inspect water notices in RSS
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from xml.etree import ElementTree as ET
          import re,html
          for u in ['https://newsrostov.ru/rss.xml','https://news-don.ru/rss.xml']:
            try:
              with urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=15) as resp: body=resp.read(6_000_000)
              root=ET.fromstring(body)
              items=root.findall('.//item')
              print('FEED_FORMAT',u,'total bytes',len(body),'items',len(items),'keys', sorted({x.tag for i in items[:3] for x in i}))
              for item in items[:250]:
                tit=item.findtext('title','') or ''
                desc=item.findtext('description','') or ''
                rest=' '.join(item.itertext())
                if re.search(r'Шахт|водоснабжен|водоканал|филиал',rest,re.I):
                  if re.search('Шахт',rest,re.I) and re.search('водоснабжен|водоканал|ГУП РО|Филиал',rest,re.I):
                    print('FEED_NOTICE',u[:23],item.findtext('pubDate'),tit[:90],item.findtext('link'), 'len=',len(rest), 'hint=',re.sub(r'\\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',desc)))[:160])
              print('FEED_FIRST',u,[(i.findtext('title','')[:60],i.findtext('pubDate')) for i in items[:3]])
            except Exception as e:print('FEED_ERROR',u,str(e)[:150])
          PY
      - name: Publish JSON to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gorod-control/data/water.json
          if ! git diff --cached --quiet; then
            git commit -m 'city-control: refresh water notices'
            git push origin HEAD:main
          fi
