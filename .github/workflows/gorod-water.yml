name: City Control | Shakhty Water Notices
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'gorod-control/scripts/**'
      - '.github/workflows/gorod-water.yml'
permissions:
  contents: write
concurrency:
  group: gorod-control-water
  cancel-in-progress: false
jobs:
  update-water:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser including address and restoration
        run: python -m unittest discover -s gorod-control/scripts -p 'test_*.py' -v
      - name: Test mobile address matching and JavaScript
        run: node gorod-control/scripts/test_frontend.mjs
      - name: Probe power, gas and emergency feeds
        run: python gorod-control/scripts/probe_service_sources.py
      - name: Fetch public Shakhty water notices
        run: python gorod-control/scripts/collect_water.py
      - name: Validate mobile app JavaScript
        run: |
          python - <<'PY'
          import re,subprocess,pathlib,tempfile
          html=pathlib.Path('gorod-control/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s+[^>]*)?>(.*?)</script>',html,re.S|re.I)
          if len(scripts)<2:raise SystemExit('Expected inline logic and frontend scripts')
          for i,s in enumerate(scripts):
            with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as t:
              t.write(s);fn=t.name
            proc=subprocess.run(['node','--check',fn],capture_output=True,text=True)
            if proc.returncode:raise SystemExit('JavaScript '+str(i)+' invalid: '+proc.stderr)
          print('JavaScript source syntax OK:',len(scripts),'scripts')
          PY
      - name: Publish current JSON atomically
        run: |
          cp gorod-control/data/water.json /tmp/city-control-water.json
          BUILT_PARSER_SHA=$(git rev-parse HEAD:gorod-control/scripts)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            CURRENT_PARSER_SHA=$(git rev-parse origin/main:gorod-control/scripts)
            if [ "$BUILT_PARSER_SHA" != "$CURRENT_PARSER_SHA" ]; then
              echo 'Parser updated while checking notices; skip old results. New push will trigger refreshed collection.'
              exit 0
            fi
            git checkout -B city-control-water-publish origin/main
            cp /tmp/city-control-water.json gorod-control/data/water.json
            git add gorod-control/data/water.json
            if git diff --cached --quiet; then echo 'No new data'; break; fi
            git commit -m 'city-control: refresh verified water notices'
            if git push origin HEAD:main; then echo 'Water notices published'; break; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep 2
          done
