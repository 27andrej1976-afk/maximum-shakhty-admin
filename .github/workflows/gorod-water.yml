name: City Control | Shakhty Water Notices
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'gorod-control/scripts/**'
      - '.github/workflows/gorod-water.yml'
permissions:
  contents: write
concurrency:
  group: gorod-control-water
  cancel-in-progress: false
jobs:
  update-water:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser including address and restoration
        run: python -m unittest discover -s gorod-control/scripts -p 'test_*.py' -v
      - name: Fetch public Shakhty water notices
        run: python gorod-control/scripts/collect_water.py
      - name: Probe near-real-time municipal repost channels
        run: |
          python - <<'PY'
          import re
          from urllib.request import Request, urlopen
          channels=['shakhtinskiy','admshakhty','stopshahty','shakhty_sos']
          for ch in channels:
            url='https://t.me/s/'+ch
            try:
              req=Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
              with urlopen(req,timeout=12) as response:
                html=response.read(1500000).decode('utf-8','replace')
              dates=re.findall(r'<time[^>]*datetime="([^"]+)"',html)
              ids=re.findall(r'data-post="([^"]+)"',html)
              print(ch,'HTTP 200','posts',len(ids),'last',max(dates) if dates else 'none','id',ids[-1] if ids else '')
            except Exception as e:print(ch,'UNAVAILABLE',str(e)[:90])
          PY
      - name: Publish JSON to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gorod-control/data/water.json
          if ! git diff --cached --quiet; then
            git commit -m 'city-control: refresh water notices'
            git push origin HEAD:main
          fi
