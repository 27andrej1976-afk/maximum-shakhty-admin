name: City Control | Bright map Android APK v1.0
on:
  workflow_dispatch:
  push:
    branches: [city-map-light-v10]
    paths:
      - '.github/workflows/gorod-light-apk.yml'
      - 'gorod-control/light-v10/android_sanity.py'
permissions:
  contents: write
concurrency:
  group: city-light-android-apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK and Gradle build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore pinned v0.8 source parser
        run: |
          git fetch --no-tags --depth=1 origin city-sources-v08
          mkdir -p gorod-control/source-lab-v08
          git show FETCH_HEAD:gorod-control/source-lab-v08/water_verified.py > gorod-control/source-lab-v08/water_verified.py
          test "$(git hash-object gorod-control/source-lab-v08/water_verified.py)" = a62034202ed9c17c0d7fff05dca533146389b735
      - name: Prepare verified 0.9 native app with modern bright map and coat
        run: |
          set -euo pipefail
          python gorod-control/direct-v09/prepare.py
          python -m pip install --quiet pillow
          python gorod-control/direct-v09/build_coat_icon.py
          python - <<'PY'
          from pathlib import Path
          import shutil,re
          root=Path('gorod-control')
          app=root/'android/app'
          vendor=root/'light-v10/vendor'
          assert (vendor/'maplibre-gl.js').stat().st_size>500000
          assert (vendor/'leaflet-maplibre-gl.js').stat().st_size>4000
          shutil.copytree(vendor,app/'src/main/assets/web/light-v10/vendor',dirs_exist_ok=True)
          html=(app/'src/main/assets/web/index.html').read_text()
          assert 'light-v10/vendor/maplibre-gl.js' in html
          assert 'maplibre-gl.css' in html
          mapjs=app/'src/main/assets/web/map-v07/city-map.js'
          assert 'setupBrightBasemap' in mapjs.read_text()
          gradle=app/'build.gradle';s=gradle.read_text()
          assert "applicationId 'ru.citycontrol.shakhty.beta'" in s
          s=s.replace("applicationId 'ru.citycontrol.shakhty.beta'","applicationId 'ru.citycontrol.shakhty.light'")
          s=re.sub(r'versionCode \d+','versionCode 12',s)
          s=re.sub(r"versionName '[^']+'","versionName '1.0.0-light'",s)
          gradle.write_text(s)
          manifest=app/'src/main/AndroidManifest.xml'
          s=manifest.read_text().replace('android:label="Город · тест 0.9"','android:label="Город · светлая карта"')
          manifest.write_text(s)
          native=app/'src/main/java/ru/citycontrol/shakhty/MainActivity.java'
          s=native.read_text()
          needle='relative.equals("index.html")||relative.startsWith("map-v07/")'
          assert needle in s
          s=s.replace(needle,needle+'||relative.startsWith("light-v10/vendor/")')
          native.write_text(s)
          print('Standalone installed app: exact home notifications, bundled bright map, no API key; original app unchanged')
          PY
      - name: Compile Android APK
        working-directory: gorod-control/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signed package and embedded Shakhty coat and vector assets
        run: |
          set -euo pipefail
          APK=gorod-control/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ru.citycontrol.shakhty.light'"
          unzip -l "$APK" | grep 'res/drawable-nodpi-v4/coat_launcher.png'
          unzip -l "$APK" | grep 'assets/web/light-v10/vendor/maplibre-gl.js'
          mkdir -p /tmp/city-light-apk
          cp "$APK" /tmp/city-light-apk/GorodPodKontrolem-Shakhty-Light-1.0.apk
          sha256sum /tmp/city-light-apk/*.apk
      - name: Enable Android emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore Android smoke test from isolated development branch
        run: |
          git fetch --no-tags --depth=1 origin city-map-light-v10
          mkdir -p gorod-control/light-v10
          git show FETCH_HEAD:gorod-control/light-v10/android_sanity.py > gorod-control/light-v10/android_sanity.py
          python -m py_compile gorod-control/light-v10/android_sanity.py
      - name: Install APK and verify map and city mode on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python -m pip install --quiet websocket-client
            python gorod-control/light-v10/android_sanity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-light-v10-android-test-report
          path: light-android-test-report/
          if-no-files-found: warn
      - name: Publish only successfully installed independent light APK
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -f -B light-apk-publish origin/main
            mkdir -p gorod-control/light-v10/downloads
            cp /tmp/city-light-apk/*.apk gorod-control/light-v10/downloads/
            git add gorod-control/light-v10/downloads/GorodPodKontrolem-Shakhty-Light-1.0.apk
            if git diff --cached --quiet; then echo 'Light APK already published'; break; fi
            git commit -m 'City Control: release keyless Bright city map Android APK'
            if git push origin HEAD:main; then echo 'LIGHT MAP APK PUBLISHED'; break; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep 2
          done
