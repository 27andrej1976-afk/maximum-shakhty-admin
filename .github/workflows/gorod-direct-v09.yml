name: City Control | Direct sources and APK v0.9
on:
  workflow_dispatch:
  push:
    branches: [city-direct-v09]
    paths:
      - 'gorod-control/direct-v09/**'
      - '.github/workflows/gorod-direct-v09.yml'
permissions:
  contents: read
concurrency:
  group: city-direct-v09
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inspection browser
        run: |
          python -m pip install --quiet playwright cryptography
          python -m playwright install --with-deps chromium >/dev/null
      - name: Verify direct official source and TLS chain
        run: python gorod-control/direct-v09/inspect_power.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-direct-v09-report
          path: direct-report
          retention-days: 7
