name: City Control | Three agency report routing pilot
on:
  workflow_dispatch:
  push:
    branches: [city-reports-pilot-v12]
    paths:
      - 'gorod-control/reports-pilot-v12/**'
      - '.github/workflows/gorod-reports-v12.yml'
permissions:
  contents: write
concurrency:
  group: city-control-reports-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static safety checks
        run: |
          node --check gorod-control/reports-pilot-v12/router.js
          python -m py_compile gorod-control/reports-pilot-v12/test_browser.py
          python - <<'PY'
          from pathlib import Path
          js=Path('gorod-control/reports-pilot-v12/router.js').read_text()
          assert 'navigator.clipboard' in js and 'fetch(' not in js
          assert 'tel:+78632855777' not in js
          assert "telephone:\"+78632855777\"" in js
          assert "telephone:\"+78002220550\"" in js
          assert 'window.CivicReportPilot' in js
          assert 'НЕ ДОСТАВЛЕНО' in js
          print('Pilot has no network send paths; official contacts are route targets only')
          PY
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Test correct routing, false receipt prevention, phone links and mobile UI
        run: python gorod-control/reports-pilot-v12/test_browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: civic-routing-pilot-v12-results
          path: civic-routing-test-report/
      - name: Publish only standalone pilot, never modify original app or APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/civic-pilot
          cp gorod-control/reports-pilot-v12/index.html gorod-control/reports-pilot-v12/router.js /tmp/civic-pilot/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -f -B civic-routing-publish origin/main
            mkdir -p gorod-control/reports-pilot-v12
            cp /tmp/civic-pilot/index.html /tmp/civic-pilot/router.js gorod-control/reports-pilot-v12/
            git add gorod-control/reports-pilot-v12/index.html gorod-control/reports-pilot-v12/router.js
            if git diff --cached --quiet; then break; fi
            git commit -m 'City Control: isolated three-agency issue routing browser pilot'
            if git push origin HEAD:main; then echo 'CIVIC PILOT PUBLISHED'; break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done
