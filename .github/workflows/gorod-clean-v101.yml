name: City Control | Clean map no flags v1.0.2
on:
  workflow_dispatch:
  push:
    branches: [city-map-no-flags-v101]
    paths:
      - 'gorod-control/clean-v101/**'
permissions:
  contents: write
concurrency:
  group: city-control-clean-map-v101
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove bottom Leaflet branding, preserve visible legal credits and disable flag layers
        run: |
          python gorod-control/clean-v101/apply.py
          node --check gorod-control/map-v07/city-map.js
          python -m py_compile gorod-control/clean-v101/test_browser.py
          python - <<'PY'
          from pathlib import Path
          js=Path('gorod-control/map-v07/city-map.js').read_text()
          assert 'attributionControl:false' in js
          assert '© OpenStreetMap' in js and '© OpenMapTiles' in js
          assert 'removeCountryFlagSymbols' in js
          assert 'mapCreditTiles' in js
          assert '© OpenStreetMap' not in Path('gorod-control/map-v07/city-map.css').read_text()
          PY
      - name: Validate existing parser and address regressions
        run: |
          python -m unittest discover -s gorod-control/scripts -p 'test_*.py' -v
          node gorod-control/scripts/test_frontend.mjs
      - name: Install Chromium test browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Test real Bright map, country flag suppression, home and city mode, OSM fallback
        run: python gorod-control/clean-v101/test_browser.py
      - name: Save screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        id: optional_archive_1
        continue-on-error: true
        with:
          retention-days: 7
          name: clean-map-v101-browser-report
          path: clean-map-test-report/
          if-no-files-found: warn
      - name: Report unavailable optional archive 1
        if: ${{ always() && steps.optional_archive_1.outcome == 'failure' }}
        run: |
          echo "::warning::Optional test archive was not saved; inspect upload logs. Build, test and publication failures are not ignored."
          echo "Optional test archive was not saved. Inspect upload logs; actual build, test and publication steps retain their failure status." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish ONLY map UI with validated copyright above map
        run: |
          set -euo pipefail
          BASE_JS=$(git rev-parse HEAD:gorod-control/map-v07/city-map.js)
          BASE_CSS=$(git rev-parse HEAD:gorod-control/map-v07/city-map.css)
          BASE_HTML=$(git rev-parse HEAD:gorod-control/index.html)
          cp gorod-control/map-v07/city-map.js /tmp/city-clean-map.js
          cp gorod-control/map-v07/city-map.css /tmp/city-clean-map.css
          cp gorod-control/index.html /tmp/city-clean-index.html
          git restore gorod-control/index.html gorod-control/map-v07/city-map.js gorod-control/map-v07/city-map.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if [ "$(git rev-parse origin/main:gorod-control/map-v07/city-map.js)" != "$BASE_JS" ] ||
               [ "$(git rev-parse origin/main:gorod-control/map-v07/city-map.css)" != "$BASE_CSS" ] ||
               [ "$(git rev-parse origin/main:gorod-control/index.html)" != "$BASE_HTML" ]; then
              echo 'Concurrent application change; refuse to overwrite and require re-test.'
              exit 1
            fi
            git checkout -f -B city-clean-map-publish origin/main
            cp /tmp/city-clean-map.js gorod-control/map-v07/city-map.js
            cp /tmp/city-clean-map.css gorod-control/map-v07/city-map.css
            cp /tmp/city-clean-index.html gorod-control/index.html
            git add gorod-control/index.html gorod-control/map-v07/city-map.js gorod-control/map-v07/city-map.css
            if git diff --cached --quiet; then echo 'Map already updated'; break; fi
            git commit -m 'City Control map: no bottom Leaflet/footer or country flags; top copyright links'
            if git push origin HEAD:main; then echo 'CLEAN MAP PUBLISHED'; break; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep 3
          done
  android:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore validated parser and exact emulator checks
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin city-sources-v08
          mkdir -p gorod-control/source-lab-v08
          git show FETCH_HEAD:gorod-control/source-lab-v08/water_verified.py > gorod-control/source-lab-v08/water_verified.py
          test "$(git hash-object gorod-control/source-lab-v08/water_verified.py)" = a62034202ed9c17c0d7fff05dca533146389b735
          git fetch --no-tags --depth=1 origin city-map-no-flags-v101
          mkdir -p gorod-control/clean-v101
          git show FETCH_HEAD:gorod-control/clean-v101/android_sanity.py > gorod-control/clean-v101/android_sanity.py
          python -m py_compile gorod-control/clean-v101/android_sanity.py
      - name: Prepare updated native app with installed Shakhty coat and clean map
        run: |
          set -euo pipefail
          python gorod-control/direct-v09/prepare.py
          python -m pip install --quiet pillow
          python gorod-control/direct-v09/build_coat_icon.py
          python - <<'PY'
          import re
          from pathlib import Path
          app=Path('gorod-control/android/app')
          index=(app/'src/main/assets/web/index.html').read_text()
          js=(app/'src/main/assets/web/map-v07/city-map.js').read_text()
          assert "city-map.js?v=1.0.2-clean" in index
          assert "attributionControl:false" in js
          assert "removeCountryFlagSymbols" in js
          assert "© OpenStreetMap" in js and "© OpenMapTiles" in js
          gradle=app/'build.gradle';s=gradle.read_text()
          assert "applicationId 'ru.citycontrol.shakhty.beta'" in s
          s=s.replace("applicationId 'ru.citycontrol.shakhty.beta'","applicationId 'ru.citycontrol.shakhty.clean'")
          s=re.sub(r'versionCode \d+','versionCode 13',s)
          s=re.sub(r"versionName '[^']+'","versionName '1.0.2-clean'",s)
          gradle.write_text(s)
          manifest=app/'src/main/AndroidManifest.xml'
          s=manifest.read_text().replace('android:label="Город · тест 0.9"','android:label="Город · без флагов"')
          manifest.write_text(s)
          native=app/'src/main/java/ru/citycontrol/shakhty/MainActivity.java'
          s=native.read_text()
          anchor='relative.equals("index.html")||relative.startsWith("map-v07/")'
          assert anchor in s
          s=s.replace(anchor,anchor+'||relative.startsWith("light-v10/vendor/")')
          native.write_text(s)
          vendor=Path('gorod-control/light-v10/vendor')
          assert (vendor/'maplibre-gl.js').stat().st_size>500000
          import shutil
          shutil.copytree(vendor,app/'src/main/assets/web/light-v10/vendor',dirs_exist_ok=True)
          print('Clean map APK contains map assets and visible license near map title; existing APK untouched')
          PY
      - name: Compile signed Android debug APK
        working-directory: gorod-control/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Check package icon and Android signature
        run: |
          set -euo pipefail
          APK=gorod-control/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ru.citycontrol.shakhty.clean'"
          unzip -l "$APK" | grep 'res/drawable-nodpi-v4/coat_launcher.png'
          unzip -l "$APK" | grep 'assets/web/light-v10/vendor/maplibre-gl.js'
          mkdir -p /tmp/city-clean-apk
          cp "$APK" /tmp/city-clean-apk/GorodPodKontrolem-Shakhty-Clean-1.0.2.apk
          sha256sum /tmp/city-clean-apk/*.apk
      - name: Enable Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test map in actual Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python -m pip install --quiet websocket-client
            python gorod-control/clean-v101/android_sanity.py
      - uses: actions/upload-artifact@v4
        id: optional_archive_2
        continue-on-error: true
        if: always()
        with:
          retention-days: 7
          name: city-clean-v101-android-report
          path: clean-android-test-report/
          if-no-files-found: warn
      - name: Report unavailable optional archive 2
        if: ${{ always() && steps.optional_archive_2.outcome == 'failure' }}
        run: |
          echo "::warning::Optional test archive was not saved; inspect upload logs. Build, test and publication failures are not ignored."
          echo "Optional test archive was not saved. Inspect upload logs; actual build, test and publication steps retain their failure status." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish new tested separate APK
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -f -B city-clean-apk-publish origin/main
            mkdir -p gorod-control/clean-v101/downloads
            cp /tmp/city-clean-apk/*.apk gorod-control/clean-v101/downloads/
            git add gorod-control/clean-v101/downloads/GorodPodKontrolem-Shakhty-Clean-1.0.2.apk
            if git diff --cached --quiet; then echo 'APK already published'; break; fi
            git commit -m 'City Control: publish tested clean map APK with Shakhty coat'
            if git push origin HEAD:main; then echo 'CLEAN MAP APK PUBLISHED'; break; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep 3
          done
