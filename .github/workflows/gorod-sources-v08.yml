name: City Control | Isolated Source Audit v0.8
on:
  workflow_dispatch:
  push:
    branches: [city-sources-v08]
    paths:
      - 'gorod-control/source-lab-v08/**'
permissions:
  contents: read
concurrency:
  group: city-source-audit-v08
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check existing parser tests without modifying app
        run: |
          python -m unittest discover -s gorod-control/scripts -p 'test_*.py' -v
          node gorod-control/scripts/test_frontend.mjs
      - name: Probe public feeds and capture real historical and current fixtures
        run: python gorod-control/source-lab-v08/probe.py
      - name: Replay 21 real publications and 16 lifecycle edge cases
        run: |
          set -euo pipefail
          python gorod-control/source-lab-v08/test_verified.py 2>&1 | tee gorod-control/source-lab-v08/report/replay-tests.log
          python gorod-control/source-lab-v08/evaluate.py
      - name: Prepare isolated browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Verify candidate messages and public street geometry in mobile UI
        run: python gorod-control/source-lab-v08/browser_check.py
      - name: Save evidence, test results and candidate sources
        if: always()
        uses: actions/upload-artifact@v4
        id: optional_archive_1
        continue-on-error: true
        with:
          retention-days: 7
          name: city-sources-v08-audit
          path: gorod-control/source-lab-v08/report
          if-no-files-found: error
      - name: Report unavailable optional archive 1
        if: ${{ always() && steps.optional_archive_1.outcome == 'failure' }}
        run: |
          echo "::warning::Optional test archive was not saved; inspect upload logs. Build, test and publication failures are not ignored."
          echo "Optional test archive was not saved. Inspect upload logs; actual build, test and publication steps retain their failure status." >> "$GITHUB_STEP_SUMMARY"
