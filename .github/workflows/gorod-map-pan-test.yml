name: City map | isolated pan regression
on:
  workflow_dispatch:
  push:
    branches: [city-map-pan-sync-20261018]
    paths:
      - 'gorod-control/light-v10/vendor/leaflet-maplibre-gl.js'
      - 'gorod-control/map-v07/test_pan_sync.mjs'
      - 'gorod-control/map-v07/test_pan_browser.py'
permissions:
  contents: read
jobs:
  javascript-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check gorod-control/light-v10/vendor/leaflet-maplibre-gl.js
          node --check gorod-control/map-v07/city-map.js
          node --check gorod-control/map-v07/test_pan_sync.mjs
      - name: Verify vector basemap synchronization and both interface imports
        run: node gorod-control/map-v07/test_pan_sync.mjs

  browser-pan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tools
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Drag both map variants and compare vector/marker pixels
        run: python gorod-control/map-v07/test_pan_browser.py
      - uses: actions/upload-artifact@v4
        id: optional_archive_1
        continue-on-error: true
        if: failure()
        with:
          retention-days: 7
          name: city-map-drag-debug
          path: map-pan-failure*.png
          if-no-files-found: ignore
      - name: Report unavailable optional archive 1
        if: ${{ always() && steps.optional_archive_1.outcome == 'failure' }}
        run: |
          echo "::warning::Optional test archive was not saved; inspect upload logs. Build, test and publication failures are not ignored."
          echo "Optional test archive was not saved. Inspect upload logs; actual build, test and publication steps retain their failure status." >> "$GITHUB_STEP_SUMMARY"
