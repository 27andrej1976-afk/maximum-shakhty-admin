name: City Control | Installed Android v0.9 checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gorod-v09-device-test.yml'
      - 'gorod-control/direct-v09/emulator_check.py'
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install WebView test client
        run: python -m pip install --quiet playwright
      - name: Install APK, verify real WebView and native notifications
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python gorod-control/direct-v09/emulator_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-v09-android-device-report
          path: android-device-report
          retention-days: 7
