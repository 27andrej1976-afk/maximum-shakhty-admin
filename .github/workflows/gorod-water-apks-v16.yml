name: City Control | Compact 1.9 reliability build-only
on:
  workflow_dispatch:
  push:
    branches: [repair/compact-reliability-20261029]
permissions:
  contents: read
concurrency:
  group: water-android-v19-build-only
  cancel-in-progress: false
jobs:
  build_test:
    strategy:
      fail-fast: false
      matrix:
        variant: [compact]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CITY_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Recover pinned native parser, report patch, and existing compact UI
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin d9feda8e88e19c911c0e84bd8e32332b8bf57a20
          mkdir -p gorod-control/report-apks-v15
          for name in install_reports.py prepare_variant.py android_test.py; do
            git show "FETCH_HEAD:gorod-control/report-apks-v15/$name" > "gorod-control/report-apks-v15/$name"
          done
          python -m py_compile gorod-control/report-apks-v15/*.py
          if [ "$CITY_VARIANT" = "compact" ]; then
            git fetch --no-tags --depth=1 origin city-compact-apk-v11
            mkdir -p gorod-control/compact-v11
            for name in compact.js compact.css build_compact.py; do
              git show "FETCH_HEAD:gorod-control/compact-v11/$name" > "gorod-control/compact-v11/$name"
            done
            node --check gorod-control/compact-v11/compact.js
          fi
      - name: Install browser regression runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual failed WebGL startup and all fallback controls
        run: node gorod-control/map-v07/test_fallback.mjs --browser
      - name: Prepare app with old map, native GPS, same verified feeds and approved report route
        run: |
          python -m unittest discover -s gorod-control/scripts -p 'test_*.py' -q
          node gorod-control/scripts/test_frontend.mjs
          node gorod-control/scripts/test_feed_policy.mjs
          node gorod-control/map-v07/test_fallback.mjs
          node gorod-control/map-v07/test_pan_sync.mjs
          node gorod-control/map-v07/test_zoom_mode.mjs
          python gorod-control/scripts/test_native_feed_merge.py
          python gorod-control/water-v16/prepare_release.py
          python gorod-control/direct-v09/prepare.py
          python -m pip install --quiet pillow
          python gorod-control/direct-v09/build_coat_icon.py
          python gorod-control/report-apks-v15/prepare_variant.py
      - name: Build variant
        working-directory: gorod-control/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signature, city coat, vector map and unique package ID
        run: |
          set -euo pipefail
          APK=gorod-control/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ru.citycontrol.shakhty.$CITY_VARIANT""water'"
          unzip -l "$APK" | grep 'res/drawable-nodpi-v4/coat_launcher.png'
          unzip -l "$APK" | grep 'assets/web/light-v10/vendor/maplibre-gl.js'
          mkdir -p /tmp/city-report-apk
          cp "$APK" /tmp/city-report-apk/GorodPodKontrolem-Compact-Water-1.9.apk
          sha256sum /tmp/city-report-apk/*.apk > /tmp/city-report-apk/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > /tmp/city-report-apk/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/city-report-apk/package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs gorod-control/water-v16/downloads/GorodPodKontrolem-Compact-Water-1.8.apk > /tmp/city-report-apk/previous-1.8-signature.txt
          printf 'Source commit: %s\nBuild-only; not merged or deployed.\n' "$GITHUB_SHA" > /tmp/city-report-apk/BUILD.txt
      - name: Enable virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation, map, GPS controls, complaint button on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python -m pip install --quiet websocket-client
            python gorod-control/report-apks-v15/android_test.py
      - uses: actions/upload-artifact@v4
        id: optional_archive_1
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: report-apk-${{ matrix.variant }}-android-results
          path: two-apks-android-report/
          if-no-files-found: warn
      - name: Report unavailable optional archive 1
        if: ${{ always() && steps.optional_archive_1.outcome == 'failure' }}
        run: |
          echo "::warning::Optional test archive was not saved; inspect upload logs. Build, test and publication failures are not ignored."
          echo "Optional test archive was not saved. Inspect upload logs; actual build, test and publication steps retain their failure status." >> "$GITHUB_STEP_SUMMARY"
      - name: Save tested APK without publishing or changing main
        uses: actions/upload-artifact@v4
        with:
          name: GorodPodKontrolem-Compact-Water-1.9-tested
          path: /tmp/city-report-apk/
          retention-days: 14
          if-no-files-found: error
