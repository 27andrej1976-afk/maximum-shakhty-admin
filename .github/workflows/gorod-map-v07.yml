name: City Control | City Map v0.7
on:
  workflow_dispatch:
  push:
    branches: [city-map-v07]
    paths:
      - 'gorod-control/map-v07/**'
      - '.github/workflows/gorod-map-v07.yml'
permissions:
  contents: write
concurrency:
  group: city-control-map-v07
  cancel-in-progress: false
jobs:
  city-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refine, bundle verified assets and apply isolated frontend update
        run: |
          python gorod-control/map-v07/refine.py
          python gorod-control/map-v07/apply.py
          python -m compileall -q gorod-control/map-v07
          node --check gorod-control/map-v07/city-map.js
      - name: Fetch road geometry for public affected addresses
        run: python gorod-control/map-v07/geometry.py
      - name: Existing parser and address regressions
        run: |
          python -m unittest discover -s gorod-control/scripts -p 'test_*.py' -v
          node gorod-control/scripts/test_frontend.mjs
      - name: Install browser test tools
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Test actual mobile map interaction and capture screens
        run: python gorod-control/map-v07/test_browser.py
      - name: Save map preview and interaction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-map-v07-browser-report
          path: city-map-test-report
          if-no-files-found: warn
      - name: Publish validated city-map application files without changing APK or workflows
        run: |
          set -euo pipefail
          ORIGINAL_INDEX=$(git rev-parse HEAD:gorod-control/index.html)
          mkdir -p /tmp/city-map-ready
          cp -R gorod-control/map-v07 /tmp/city-map-ready/map-v07
          cp gorod-control/index.html /tmp/city-map-ready/index.html
          cp gorod-control/data/map-geometry.json /tmp/city-map-ready/map-geometry.json
          cp gorod-control/data/street-geometry.json /tmp/city-map-ready/street-geometry.json
          find /tmp/city-map-ready -type d -name __pycache__ -exec rm -r {} +
          git checkout -- gorod-control/index.html .github/workflows/gorod-water.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            CURRENT_INDEX=$(git rev-parse origin/main:gorod-control/index.html)
            if [ "$CURRENT_INDEX" != "$ORIGINAL_INDEX" ]; then
              echo 'Concurrent application code change detected; refuse to overwrite. Refresh feature branch first.'
              exit 1
            fi
            git checkout -B city-map-publish origin/main
            mkdir -p gorod-control/map-v07 gorod-control/data
            cp -R /tmp/city-map-ready/map-v07/. gorod-control/map-v07/
            find gorod-control/map-v07 -type d -name __pycache__ -exec rm -r {} +
            cp /tmp/city-map-ready/index.html gorod-control/index.html
            cp /tmp/city-map-ready/map-geometry.json gorod-control/data/map-geometry.json
            cp /tmp/city-map-ready/street-geometry.json gorod-control/data/street-geometry.json
            git add gorod-control/index.html gorod-control/map-v07 gorod-control/data/map-geometry.json gorod-control/data/street-geometry.json
            if git diff --cached --quiet; then echo 'Already current'; break; fi
            git commit -m 'City Control v0.7: citywide map, event details and Shakhty crest; browser-tested'
            if git push origin HEAD:main; then echo 'CITY MAP PUBLISHED'; break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done
