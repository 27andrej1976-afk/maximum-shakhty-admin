name: Don Control | Seal existing MAX session to authorized FirstVDS
on:
  workflow_dispatch:
  push:
    branches: [feature/rostov-max-only]
    paths:
      - .github/workflows/gorod-don-session-transfer.yml
      - gorod-control/region-v2/seal_session.py
      - gorod-control/region-v2/session-transfer/recipient.public
permissions:
  contents: read
jobs:
  seal:
    if: github.ref == 'refs/heads/feature/rostov-max-only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyNaCl==1.6.2
      - name: Encrypt to the server-only private key without account login
        env:
          MAX_USER_SESSION_B64: ${{ secrets.MAX_USER_SESSION_B64 }}
        run: python gorod-control/region-v2/seal_session.py --recipient gorod-control/region-v2/session-transfer/recipient.public --output /tmp/don-max-session.sealed --manifest /tmp/don-max-transfer.json
      - uses: actions/upload-artifact@v4
        with:
          name: don-max-session-encrypted-for-existing-firstvds
          path: |
            /tmp/don-max-session.sealed
            /tmp/don-max-transfer.json
          retention-days: 1
          if-no-files-found: error
