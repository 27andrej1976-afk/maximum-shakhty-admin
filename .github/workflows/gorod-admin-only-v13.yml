name: City Control | Unified administration routing v1.3 pilot
on:
  workflow_dispatch:
  push:
    branches: [city-reports-admin-only-v13]
    paths:
      - 'gorod-control/reports-admin-v13/**'
permissions:
  contents: write
jobs:
  test_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate no backend sends or false delivery
        run: |
          node --check gorod-control/reports-admin-v13/router.js
          python -m py_compile gorod-control/reports-admin-v13/test_browser.py
          python - <<'PY'
          from pathlib import Path
          p=Path('gorod-control/reports-admin-v13/router.js').read_text()
          assert 'fetch(' not in p
          assert 'ОЖИДАЕТ ПОДАЧИ — НЕ ДОСТАВЛЕНО' in p
          assert 'Администрация города Шахты' in p
          assert "const categories=" in p
          assert 'sourceRoutes:routes' in p
          print('No real government request sent by prototype')
          PY
      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Verify three categories route only to administration
        run: python gorod-control/reports-admin-v13/test_browser.py
      - uses: actions/upload-artifact@v4
        id: optional_archive_1
        continue-on-error: true
        if: always()
        with:
          retention-days: 7
          name: civic-admin-only-v13-browser-evidence
          path: civic-routing-test-report/
          if-no-files-found: warn
      - name: Report unavailable optional archive 1
        if: ${{ always() && steps.optional_archive_1.outcome == 'failure' }}
        run: |
          echo "::warning::Optional test archive was not saved; inspect upload logs. Build, test and publication failures are not ignored."
          echo "Optional test archive was not saved. Inspect upload logs; actual build, test and publication steps retain their failure status." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only isolated preview after tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/admin-v13-ready
          cp gorod-control/reports-admin-v13/index.html gorod-control/reports-admin-v13/router.js /tmp/admin-v13-ready/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for try in 1 2 3 4; do
            git fetch origin main
            git checkout -f -B publish-admin-v13 origin/main
            mkdir -p gorod-control/reports-admin-v13
            cp /tmp/admin-v13-ready/index.html /tmp/admin-v13-ready/router.js gorod-control/reports-admin-v13/
            git add gorod-control/reports-admin-v13/index.html gorod-control/reports-admin-v13/router.js
            if git diff --cached --quiet; then break; fi
            git commit -m 'City Control: pilot all issue reports via Shakhty administration'
            if git push origin HEAD:main; then echo 'UNIFIED ADMIN PREVIEW PUBLISHED'; break; fi
            if [ "$try" = 4 ]; then exit 1; fi
            sleep 2
          done
