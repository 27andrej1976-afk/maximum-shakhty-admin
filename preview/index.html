<title>ТРЦ «Максимум» — предпросмотр</title>
<style>
:root{--orange:#f58220;--blue:#168acb;--bg:#f5f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--shadow:0 6px 22px rgba(0,0,0,.08)}
*{box-sizing:border-box}body{margin:0;background:#eef0f3;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.phone{width:min(100%,430px);min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.14)}
.appbar{position:sticky;top:0;z-index:10;background:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #e5e7eb}
.appbar .title{font-weight:700;flex:1}.iconbtn{border:0;background:transparent;font-size:22px;cursor:pointer;padding:8px;border-radius:50%}.iconbtn:hover{background:#f3f4f6}
.content{padding:16px}.logo{display:block;width:150px;height:150px;border-radius:50%;object-fit:cover;margin:4px auto 14px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin:0 0 12px;overflow:hidden}
.hero{padding:18px}.hero h1{font-size:28px;margin:0 0 6px}.hero p{margin:6px 0;line-height:1.45}.version{color:var(--blue);font-weight:700}
.tile{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer}.tile:hover{background:#fafafa}.tile .ico{font-size:26px;width:32px;text-align:center}.tile .mid{flex:1}.tile .name{font-size:17px;font-weight:700;margin-bottom:4px}.tile .sub{font-size:14px;color:var(--muted);line-height:1.35}.chev{font-size:26px;color:#9ca3af}
.back{font-size:24px}.pageTitle{font-size:20px;font-weight:700;flex:1}.section{padding:24px;text-align:center;line-height:1.6}.section img{width:100%;border-radius:16px;margin-bottom:18px}
.floor{padding:16px}.floor h3{margin:0 0 7px;font-size:20px}.floor p{margin:0;color:#4b5563;line-height:1.45}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--orange);color:#fff;font-weight:700;padding:12px 18px;cursor:pointer;text-decoration:none}.outline{background:#fff;color:var(--orange);border:1px solid var(--orange)}
.storeLogo{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#eee}.storeBody{padding:20px}.storeBody h2{margin:0 0 6px}.storeBody p{line-height:1.55}.actions{display:grid;gap:10px;margin-top:24px}
.big{font-size:1.22em}.loading{padding:50px 20px;text-align:center;color:var(--muted)}.error{padding:30px 20px;text-align:center;color:#b91c1c}
</style>

let data={}, big=false;
const app=document.getElementById('app');

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function bar(title,back=false){
 return '<div class="appbar">'+(back?'<button class="iconbtn back" onclick="home()">‹</button>':'')+
 '<div class="'+(back?'pageTitle':'title')+'">'+esc(title)+'</div>'+
 (!back?'<button class="iconbtn" title="Обновить" onclick="load()">↻</button><button class="iconbtn" title="Крупный шрифт" onclick="toggleText()">A+</button>':'')+'</div>';
}
function toggleText(){big=!big;document.querySelector('.phone').classList.toggle('big',big)}
async function api(path){const r=await fetch(SUPA+'/rest/v1/'+path,{headers:{apikey:KEY}});if(!r.ok)throw new Error(r.status);return r.json()}
async function load(){
 app.innerHTML=bar('МАКСИМУМ • ШАХТЫ')+'<div class="loading">Загружаю актуальные данные…</div>';
 try{
   const rows=await api('maximum_content?select=section,title,body,image_url&is_published=eq.true&order=id.asc');
   data={}; rows.forEach(x=>data[x.section]=x); home();
 }catch(e){
   app.innerHTML=bar('МАКСИМУМ • ШАХТЫ')+'<div class="error">Не удалось загрузить актуальные данные.<br><br><button class="button" onclick="load()">Повторить</button></div>';
 }
}
function home(){
 const h=data.home||{};
 const items=[
  ['map','🗺️','Карта ТРЦ','Этажи 0–4 и магазины'],
  ['cinema','🎬',(data.cinema||{}).title||'Кино',(data.cinema||{}).body||''],
  ['kids','🏆',(data.kids||{}).title||'Найди Попугая',(data.kids||{}).body||''],
  ['loyalty','🏷️',(data.loyalty||{}).title||'Лояльность',(data.loyalty||{}).body||''],
  ['mom_baby','👶',(data.mom_baby||{}).title||'Мама и малыш',(data.mom_baby||{}).body||'']
 ];
 app.innerHTML=bar('МАКСИМУМ • ШАХТЫ')+'<div class="content"><img class="logo" src="'+logo+'">'+
 '<div class="card hero"><h1>'+esc(h.title||'ТРЦ «Максимум»')+'</h1><p>'+esc(h.body||'Шахты • пер. Красный Шахтёр, 78')+'</p><p>Магазины, кино, развлечения и бонусы — в одном приложении.</p><p class="version">Тестовая версия 0.2.0</p></div>'+
 items.map(x=>'<div class="card tile" onclick="openSection(\''+x[0]+'\')"><div class="ico">'+x[1]+'</div><div class="mid"><div class="name">'+esc(x[2])+'</div><div class="sub">'+esc(x[3])+'</div></div><div class="chev">›</div></div>').join('')+'</div>';
 if(big)app.classList.add('big');
}
function openSection(s){
 if(s==='map')return mapPage();
 const x=data[s]||{};app.innerHTML=bar(x.title||s,true)+'<div class="section">'+(x.image_url?'<img src="'+esc(x.image_url)+'" onerror="this.style.display=\'none\'">':'')+'<p>'+esc(x.body||'')+'</p></div>';
}
function mapPage(){
 app.innerHTML=bar('Карта ТРЦ',true)+'<div class="content">'+
 '<div class="card floor"><h3>0 этаж</h3><p>Пятёрочка</p><br><button class="button" onclick="floor0()">Открыть 0 этаж →</button></div>'+
 '<div class="card floor"><h3>1 этаж</h3></div>'+
 '<div class="card floor"><h3>2 этаж</h3></div>'+
 '<div class="card floor"><h3>3 этаж</h3><p>Детский центр «Попугай»</p></div>'+
 '<div class="card floor"><h3>4 этаж</h3><p>Кинотеатр «МОНИТОР Максимум» • 6 залов • Relax-зал</p></div></div>';
}
async function floor0(){
 app.innerHTML=bar('0 этаж',true)+'<div class="loading">Загружаю магазины…</div>';
 try{
  const f=await api('maximum_floors?select=id&floor_number=eq.0&is_published=eq.true');
  if(!f.length){app.innerHTML=bar('0 этаж',true)+'<div class="loading">На этом этаже пока нет опубликованных магазинов.</div>';return}
  const st=await api('maximum_stores?select=id,name,category,description,working_hours,website_url,image_url&floor_id=eq.'+f[0].id+'&is_published=eq.true&order=sort_order.asc');
  app.innerHTML=bar('0 этаж',true)+'<div class="content">'+st.map((s,i)=>'<div class="card tile" onclick="storePage('+i+')">'+(s.name.toLowerCase().includes('пятёроч')?'<img class="storeLogo" src="'+p5Logo+'">':(s.image_url?'<img class="storeLogo" src="'+esc(s.image_url)+'">':'<div class="ico">🏬</div>'))+'<div class="mid"><div class="name">'+esc(s.name)+'</div><div class="sub">'+esc(s.category)+'</div></div><div class="chev">›</div></div>').join('')+'</div>';
  window.__stores=st;
 }catch(e){app.innerHTML=bar('0 этаж',true)+'<div class="error">Не удалось загрузить магазины.</div>'}
}
function storePage(i){
 const s=(window.__stores||[])[i]; if(!s)return;
 app.innerHTML=bar(s.name,true)+'<div class="storeBody">'+(s.name.toLowerCase().includes('пятёроч')?'<img style="width:100%;border-radius:16px" src="'+p5Logo+'">':(s.image_url?'<img style="width:100%;border-radius:16px" src="'+esc(s.image_url)+'">':''))+
 '<h2>'+esc(s.name)+'</h2><div style="color:#6b7280">'+esc(s.category||'')+'</div><p>'+esc(s.description||'')+'</p>'+(s.working_hours?'<p><b>Режим работы:</b> '+esc(s.working_hours)+'</p>':'')+
 '<div class="actions"><a class="button" href="https://www.rustore.ru/catalog/app/ru.pyaterochka.app.browser" target="_blank">Открыть Пятёрочку</a>'+(s.website_url?'<a class="button outline" href="'+esc(s.website_url)+'" target="_blank">Официальный сайт</a>':'')+'</div></div>';
}
load();
</script>
</body></html>
