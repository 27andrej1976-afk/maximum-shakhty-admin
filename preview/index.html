<style>
:root{--orange:#f58220;--blue:#168acb;--bg:#f5f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--shadow:0 6px 22px rgba(0,0,0,.08)}
*{box-sizing:border-box}body{margin:0;background:#eef0f3;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.phone{width:min(100%,430px);min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.14)}
.appbar{position:sticky;top:0;z-index:10;background:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #e5e7eb}
.title,.pageTitle{font-weight:800;flex:1}.iconbtn{border:0;background:transparent;font-size:22px;cursor:pointer;padding:8px;border-radius:50%}.back{font-size:24px}
.content{padding:16px}.logo{display:block;width:150px;height:150px;border-radius:50%;object-fit:cover;margin:4px auto 14px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin:0 0 12px;overflow:hidden;border:1px solid rgba(230,234,240,.7)}
.hero{padding:18px}.hero h1{font-size:28px;margin:0 0 6px}.hero h2{font-size:22px;margin:0 0 8px}.hero p{margin:6px 0;line-height:1.45}.version{color:var(--blue);font-weight:800}
.tile{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer}.tile:hover{background:#fafafa}.ico,.storeLogo{width:64px;height:64px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid #eef1f4;padding:5px;flex:0 0 auto}
.tile .mid{flex:1}.tile .name{font-size:17px;font-weight:800;margin-bottom:4px}.tile .sub{font-size:14px;color:var(--muted);line-height:1.35}.chev{font-size:26px;color:#9ca3af}
.floor{padding:16px}.floor h3{margin:0 0 7px;font-size:20px}.floor p{margin:0;color:#4b5563;line-height:1.45}.badge{display:inline-flex;margin-top:12px;background:#eef7ff;color:#168acb;font-weight:800;border-radius:999px;padding:7px 11px;font-size:13px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--orange);color:#fff;font-weight:800;padding:12px 18px;cursor:pointer;text-decoration:none}.outline{background:#fff;color:var(--orange);border:1px solid var(--orange)}
.storeBody{padding:20px}.storeBody h2{margin:0 0 6px}.storeBody p{line-height:1.55}.actions{display:grid;gap:10px;margin-top:20px}.brand{width:100%;max-height:220px;object-fit:contain;background:#fff;border-radius:16px;padding:18px;border:1px solid #eef1f4;margin-bottom:18px}.museum{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:18px;margin-bottom:18px}
.notice{font-size:13px;color:#6b7280;text-align:center;margin-top:14px;line-height:1.4}.logoMain{width:150px;height:150px;border-radius:50%;margin:4px auto 14px;background:linear-gradient(135deg,#f58220,#168acb);display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:22px;text-align:center;border:6px solid #fff;box-shadow:0 8px 22px rgba(0,0,0,.12)}
</style>
</head>

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function bar(title,back=false){document.getElementById('bar').innerHTML='<div class="appbar">'+(back?'<button class="iconbtn back" onclick="home()">‹</button>':'')+'<div class="'+(back?'pageTitle':'title')+'">'+esc(title)+'</div>'+(!back?'<button class="iconbtn">👤</button><button class="iconbtn" onclick="home()">↻</button><button class="iconbtn">A+</button>':'')+'</div>';}
function show(html){document.getElementById('app').innerHTML=html;scrollTo(0,0)}
function openExternal(url){window.open(url,'_blank','noopener,noreferrer')}
function home(){bar('МАКСИМУМ • ШАХТЫ');show(`<div class="content"><div class="logoMain">ТРЦ<br>Максимум</div><div class="card hero"><h1>ТРЦ «Максимум»</h1><p>Шахты, пер. Красный Шахтёр, 78</p><p>Магазины, кино, развлечения и бонусы — в одном приложении.</p><p class="version">Тестовая версия 0.2.0</p></div><div class="card tile" onclick="mapPage()"><div class="ico">🗺️</div><div class="mid"><div class="name">Карта ТРЦ</div><div class="sub">0–4 этажи и магазины</div></div><div class="chev">›</div></div><div class="card tile" onclick="museumPage()"><img class="storeLogo" src="${A.museum}"><div class="mid"><div class="name">Музей</div><div class="sub">«Город, рождённый шахтой» • 2 этаж</div></div><div class="chev">›</div></div><div class="card tile" onclick="loyaltyPage()"><div class="ico">🏷️</div><div class="mid"><div class="name">Лояльность</div><div class="sub">Чеки, баллы, скидки и подарки</div></div><div class="chev">›</div></div></div>`)}
function mapPage(){bar('Карта ТРЦ',true);show(`<div class="content"><div class="card floor" onclick="floor0()"><h3>0 этаж</h3><p>Пятёрочка</p><span class="badge">Открыть 0 этаж</span></div><div class="card floor" onclick="floor1()"><h3>1 этаж</h3><p>Информация появится позже</p><span class="badge">Открыть 1 этаж</span></div><div class="card floor" onclick="floor2()"><h3>2 этаж</h3><p>Музейная экспозиция</p><span class="badge">Открыть 2 этаж</span></div><div class="card floor" onclick="floor3()"><h3>3 этаж</h3><p>Максик • Zolla • М.Видео</p><span class="badge">Открыть 3 этаж</span></div><div class="card floor" onclick="floor4()"><h3>4 этаж</h3><p>МОНИТОР Максимум • Lady Stretch</p><span class="badge">Открыть 4 этаж</span></div></div>`)}
function loyaltyPage(){bar('Лояльность',true);show(`<div class="content"><div class="card hero"><h2>Лояльность</h2><p>Чеки, баллы, скидки и подарки.</p><p class="notice">Раздел подготовлен как вкладка главной страницы. Позже подключим личный кабинет и механику бонусов.</p></div></div>`)}
function floor0(){bar('0 этаж',true);show(`<div class="content"><div class="card tile" onclick="p5Page()"><img class="storeLogo" src="${A.p5}"><div class="mid"><div class="name">Пятёрочка</div><div class="sub">Продуктовый магазин • 0 этаж</div></div><div class="chev">›</div></div></div>`)}

function floor2(){bar('2 этаж',true);show(`<div class="content"><div class="card tile" onclick="museumPage()"><img class="storeLogo" src="${A.museum}"><div class="mid"><div class="name">Музей</div><div class="sub">Экспозиция • 2 этаж</div></div><div class="chev">›</div></div></div>`)}

function museumPage(){bar('Музей',true);show(`<div class="storeBody"><img class="museum" src="${A.museum}"><h2>«Город, рождённый шахтой: хроника угледобычи»</h2><p class="notice">Выездная экспозиция Шахтинского краеведческого музея • 2 этаж ТЦ «Максимум»</p><p>Экспозиция рассказывает об истории угледобычи в Шахтах. Представлены документы, карты, награды, шахтёрские каски, коногонки, фляги, самоспасатели и другие предметы труда и быта горняков.</p><p><b>Телефон:</b> <a href="tel:+78636225918">8 (8636) 22-59-18</a></p><div class="actions"><button class="button" onclick="openExternal('https://muzey-shakhtinsky.ru/')">Официальный сайт музея</button></div></div>`)}
