<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ТРЦ «Максимум» — предпросмотр</title>
<style>
:root{--orange:#f58220;--blue:#168acb;--bg:#f5f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--shadow:0 6px 22px rgba(0,0,0,.08)}
*{box-sizing:border-box}body{margin:0;background:#eef0f3;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.phone{width:min(100%,430px);min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.14)}
.appbar{position:sticky;top:0;z-index:10;background:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #e5e7eb}
.appbar .title{font-weight:700;flex:1}.iconbtn{border:0;background:transparent;font-size:22px;cursor:pointer;padding:8px;border-radius:50%}.iconbtn:hover{background:#f3f4f6}
.content{padding:16px}.logo{display:block;width:150px;height:150px;border-radius:50%;object-fit:cover;margin:4px auto 14px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin:0 0 12px;overflow:hidden}
.hero{padding:18px}.hero h1{font-size:28px;margin:0 0 6px}.hero p{margin:6px 0;line-height:1.45}.version{color:var(--blue);font-weight:700}
.tile{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer}.tile:hover{background:#fafafa}.tile .ico{font-size:26px;width:32px;text-align:center}.tile .mid{flex:1}.tile .name{font-size:17px;font-weight:700;margin-bottom:4px}.tile .sub{font-size:14px;color:var(--muted);line-height:1.35}.chev{font-size:26px;color:#9ca3af}
.back{font-size:24px}.pageTitle{font-size:20px;font-weight:700;flex:1}.section{padding:24px;text-align:center;line-height:1.6}.section img{width:100%;border-radius:16px;margin-bottom:18px}
.floor{padding:16px}.floor h3{margin:0 0 7px;font-size:20px}.floor p{margin:0;color:#4b5563;line-height:1.45}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--orange);color:#fff;font-weight:700;padding:12px 18px;cursor:pointer;text-decoration:none}.outline{background:#fff;color:var(--orange);border:1px solid var(--orange)}
.storeLogo{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#eee}.storeBody{padding:20px}.storeBody h2{margin:0 0 6px}.storeBody p{line-height:1.55}.actions{display:grid;gap:10px;margin-top:24px}
.big{font-size:1.22em}.loading{padding:50px 20px;text-align:center;color:var(--muted)}.error{padding:30px 20px;text-align:center;color:#b91c1c}

.floor3Intro{text-align:center;padding:22px 18px 8px}.floor3Intro h2{margin:0 0 7px;font-size:25px}.floor3Intro p{margin:0;color:var(--muted)}
.cubeWrap{position:relative;perspective:1000px;padding:18px 0 8px;overflow:hidden;touch-action:pan-y;user-select:none}
.cubeStage{height:360px;position:relative;transform-style:preserve-3d}
.cubeCard{position:absolute;left:50%;top:12px;width:72%;height:330px;margin-left:-36%;border-radius:24px;background:linear-gradient(145deg,#fff,#f2f4f7);box-shadow:0 18px 45px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;transition:transform .38s cubic-bezier(.2,.75,.2,1),opacity .38s,elevation .38s;cursor:pointer;border:1px solid #e5e7eb;backface-visibility:hidden}
.cubeCard .shopIco{font-size:72px;line-height:1;margin-bottom:20px}.cubeCard .shopLogo{width:min(100%,220px);height:100px;object-fit:contain;margin-bottom:16px}.cubeCard .shopShort{font-size:29px;font-weight:900;letter-spacing:1.2px}.cubeCard .shopName{font-size:16px;color:#4b5563;line-height:1.35;margin:10px 0 22px}
.cubeCard.active{transform:translateX(0) rotateY(0deg) scale(1);opacity:1;z-index:4}
.cubeCard.left{transform:translateX(-73%) rotateY(52deg) scale(.82);opacity:.58;z-index:2}
.cubeCard.right{transform:translateX(73%) rotateY(-52deg) scale(.82);opacity:.58;z-index:2}
.cubeCard.far{transform:translateX(0) rotateY(90deg) scale(.72);opacity:0;z-index:1;pointer-events:none}
.cubeNav{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 16px 6px}.cubeArrow{width:44px;height:44px;border-radius:50%;border:1px solid #d1d5db;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.07)}.cubeArrow:active{transform:scale(.96)}
.cubeDots{display:flex;justify-content:center;gap:7px}.cubeDot{width:8px;height:8px;border-radius:999px;background:#c9cdd3;transition:all .2s}.cubeDot.active{width:24px;background:var(--orange)}
.storePlaceholder{text-align:center;padding:34px 22px}.storePlaceholder .heroIco{font-size:88px}.storePlaceholder .heroLogo{width:min(100%,250px);height:120px;object-fit:contain}.storePlaceholder h2{margin:14px 0 6px}.storePlaceholder p{color:var(--muted)}

.modalBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{width:min(100%,390px);background:#fff;border-radius:20px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.26)}
.modal h2{margin:0 0 10px}.modal p{line-height:1.45;color:#4b5563}.modalActions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.field{width:100%;padding:12px 13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;margin-top:10px}
.authError{color:#b91c1c;margin-top:10px}.profileCard{text-align:center;padding:24px}.profileIcon{font-size:72px}.muted{color:#6b7280}
</style>
</head>

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function bar(title,back=false){
 return '<div class="appbar">'+(back?'<button class="iconbtn back" onclick="home()">‹</button>':'')+
 '<div class="'+(back?'pageTitle':'title')+'">'+esc(title)+'</div>'+
 (!back?'<button class="iconbtn" title="Профиль" onclick="openAccount()">👤</button><button class="iconbtn" title="Обновить" onclick="load()">↻</button><button class="iconbtn" title="Крупный шрифт" onclick="toggleText()">A+</button>':'')+'</div>';
}
function toggleText(){big=!big;document.querySelector('.phone').classList.toggle('big',big)}
async function api(path){const r=await fetch(SUPA+'/rest/v1/'+path,{headers:{apikey:KEY}});if(!r.ok)throw new Error(r.status);return r.json()}
async function load(){
 try{const r=await fetch('../assets/maxik_logo.b64');if(r.ok)maxikLogo='data:image/jpeg;base64,'+(await r.text()).trim()}catch(_){}
 app.innerHTML=bar('МАКСИМУМ • ШАХТЫ')+'<div class="loading">Загружаю актуальные данные…</div>';
 try{
   const rows=await api('maximum_content?select=section,title,body,image_url&is_published=eq.true&order=id.asc');
   data={}; rows.forEach(x=>data[x.section]=x); home(); setTimeout(maybeOfferRegistration,80);
 }catch(e){
   app.innerHTML=bar('МАКСИМУМ • ШАХТЫ')+'<div class="error">Не удалось загрузить актуальные данные.<br><br><button class="button" onclick="load()">Повторить</button></div>';
 }
}
function home(){
 const h=data.home||{};
 const items=[
  ['map','🗺️','Карта ТРЦ','Этажи 0–4 и магазины'],
  ['kids','🏛️','Музей',''],
  ['loyalty','🏷️',(data.loyalty||{}).title||'Лояльность',(data.loyalty||{}).body||'']
 ];
 app.innerHTML=bar('МАКСИМУМ • ШАХТЫ')+'<div class="content"><img class="logo" src="'+logo+'">'+
 '<div class="card hero"><h1>'+esc(h.title||'ТРЦ «Максимум»')+'</h1><p>'+esc(h.body||'Шахты • пер. Красный Шахтёр, 78')+'</p><p>Магазины, кино, развлечения и бонусы — в одном приложении.</p><p class="version">Тестовая версия 0.2.0</p></div>'+
 items.map(x=>'<div class="card tile" onclick="openSection(\''+x[0]+'\')"><div class="ico">'+x[1]+'</div><div class="mid"><div class="name">'+esc(x[2])+'</div><div class="sub">'+esc(x[3])+'</div></div><div class="chev">›</div></div>').join('')+'</div>';
 if(big)app.classList.add('big');
}
function openSection(s){
 if(s==='map')return mapPage();
 const x=data[s]||{};app.innerHTML=bar(x.title||s,true)+'<div class="section">'+(x.image_url?'<img src="'+esc(x.image_url)+'" onerror="this.style.display=\'none\'">':'')+'<p>'+esc(x.body||'')+'</p></div>';
}
function mapPage(){
 app.innerHTML=bar('Карта ТРЦ',true)+'<div class="content">'+
 '<div class="card floor"><h3>0 этаж</h3><p>Пятёрочка</p><br><button class="button" onclick="floor0()">Открыть 0 этаж →</button></div>'+
 '<div class="card floor"><h3>1 этаж</h3></div>'+
 '<div class="card floor"><h3>2 этаж</h3></div>'+
 '<div class="card tile" onclick="thirdFloor()"><div class="ico">🧊</div><div class="mid"><div class="name">3 этаж</div><div class="sub">«Максик» • Zolla • М.Видео</div></div><div class="chev">›</div></div>'+
 '<div class="card tile" onclick="fourthFloor()"><div class="ico">🎬</div><div class="mid"><div class="name">4 этаж</div><div class="sub">«МОНИТОР Максимум» • Lady Stretch</div></div><div class="chev">›</div></div></div>';
}

const floor3Shops=[
 {name:'Детский развлекательный центр «Максик»',category:'Детский развлекательный центр • 3 этаж',logo:maxikLogo,type:'none',url:''},
 {name:'Zolla',category:'Магазин одежды • 3 этаж',logo:'https://armada-2.ru/assets/images/slider/shops/logo/logo_zolla-02.png',type:'rustore',url:'https://www.rustore.ru/catalog/app/com.zolla.app'},
 {name:'М.Видео',category:'Магазин электроники • 3 этаж',logo:'https://www.directum.ru/images/organisation/Mvideo_Logo_2.png',type:'rustore',url:'https://www.rustore.ru/catalog/app/ru.filit.mvideo.b2c'}
];

function thirdFloor(){
 app.innerHTML=bar('3 этаж',true)+'<div class="content">'+
 floor3Shops.map((s,i)=>'<div class="card tile" onclick="floor3Store('+i+')">'+
 (s.logo?'<img class="storeLogo" src="'+esc(s.logo)+'" alt="'+esc(s.name)+'" onerror="this.style.display=\'none\'">':'<div class="ico">🏬</div>')+
 '<div class="mid"><div class="name">'+esc(s.name)+'</div><div class="sub">'+esc(s.category)+'</div></div><div class="chev">›</div></div>').join('')+
 '</div>';
}

function floor3Store(i){
 const s=floor3Shops[i]; if(!s)return;
 let action='';
 if(s.type==='rustore'){
   action='<a class="button" href="'+esc(s.url)+'" target="_blank">Открыть в RuStore</a>';
 } else {
   action='<button class="button outline" type="button">Подробнее</button>';
 }
 app.innerHTML=bar(s.name,true)+'<div class="storeBody">'+
 (s.logo?'<img style="width:100%;border-radius:16px;max-height:220px;object-fit:contain;background:#fff" src="'+esc(s.logo)+'" alt="'+esc(s.name)+'">':'')+
 '<h2>'+esc(s.name)+'</h2><div style="color:#6b7280">'+esc(s.category||'')+'</div>'+
 '<div class="actions">'+action+'</div></div>';
}

async function floor0(){
 app.innerHTML=bar('0 этаж',true)+'<div class="loading">Загружаю магазины…</div>';
 try{
  const f=await api('maximum_floors?select=id&floor_number=eq.0&is_published=eq.true');
  if(!f.length){app.innerHTML=bar('0 этаж',true)+'<div class="loading">На этом этаже пока нет опубликованных магазинов.</div>';return}
  const st=await api('maximum_stores?select=id,name,category,description,working_hours,website_url,image_url&floor_id=eq.'+f[0].id+'&is_published=eq.true&order=sort_order.asc');
  app.innerHTML=bar('0 этаж',true)+'<div class="content">'+st.map((s,i)=>'<div class="card tile" onclick="storePage('+i+')">'+(s.name.toLowerCase().includes('пятёроч')?'<img class="storeLogo" src="'+p5Logo+'">':(s.image_url?'<img class="storeLogo" src="'+esc(s.image_url)+'">':'<div class="ico">🏬</div>'))+'<div class="mid"><div class="name">'+esc(s.name)+'</div><div class="sub">'+esc(s.category)+'</div></div><div class="chev">›</div></div>').join('')+'</div>';
  window.__stores=st;
 }catch(e){app.innerHTML=bar('0 этаж',true)+'<div class="error">Не удалось загрузить магазины.</div>'}
}
function storePage(i){
 const s=(window.__stores||[])[i]; if(!s)return;
 app.innerHTML=bar(s.name,true)+'<div class="storeBody">'+(s.name.toLowerCase().includes('пятёроч')?'<img style="width:100%;border-radius:16px" src="'+p5Logo+'">':(s.image_url?'<img style="width:100%;border-radius:16px" src="'+esc(s.image_url)+'">':''))+
 '<h2>'+esc(s.name)+'</h2><div style="color:#6b7280">'+esc(s.category||'')+'</div><p>'+esc(s.description||'')+'</p>'+(s.working_hours?'<p><b>Режим работы:</b> '+esc(s.working_hours)+'</p>':'')+
 '<div class="actions"><a class="button" href="https://www.rustore.ru/catalog/app/ru.pyaterochka.app.browser" target="_blank">Открыть Пятёрочку</a>'+(s.website_url?'<a class="button outline" href="'+esc(s.website_url)+'" target="_blank">Официальный сайт</a>':'')+'</div></div>';
}


const floor4Places=[
 {name:'Кинотеатр «МОНИТОР Максимум»',category:'Кинотеатр • 4 этаж',logo:'https://static.tildacdn.com/tild3932-3536-4661-a132-393730326435/logo_monitor_2_versi.png'},
 {name:'Lady Stretch',category:'Студия растяжки • 4 этаж',logo:'https://shahty-ladystretch.ru/img/44279313.jpg'}
];

function fourthFloor(){
 app.innerHTML=bar('4 этаж',true)+'<div class="content">'+
 floor4Places.map((s,i)=>'<div class="card tile" onclick="floor4Place('+i+')">'+
 (s.logo?'<img class="storeLogo" src="'+esc(s.logo)+'" alt="'+esc(s.name)+'" onerror="this.style.display=\'none\'">':'<div class="ico">🏬</div>')+
 '<div class="mid"><div class="name">'+esc(s.name)+'</div><div class="sub">'+esc(s.category)+'</div></div><div class="chev">›</div></div>').join('')+
 '</div>';
}

function floor4Place(i){
 const s=floor4Places[i]; if(!s)return;
 const button=i===0
  ? '<a class="button" href="https://www.rustore.ru/catalog/app/ru.kinoplan.cinema.monitor" target="_blank">Открыть в RuStore</a>'
  : '<a class="button" href="https://shahty-ladystretch.ru/" target="_blank">Официальный сайт</a>';
 app.innerHTML=bar(s.name,true)+'<div class="storeBody">'+
 (s.logo?'<img style="width:100%;border-radius:16px;max-height:220px;object-fit:contain;background:#fff" src="'+esc(s.logo)+'" alt="'+esc(s.name)+'">':'')+
 '<h2>'+esc(s.name)+'</h2><div style="color:#6b7280">'+esc(s.category||'')+'</div>'+
 '<div class="actions">'+button+'</div></div>';
}

function authUser(){
 try{return JSON.parse(localStorage.getItem('maximum_auth_user')||'null')}catch(_){return null}
}
function closeModal(){const x=document.getElementById('authModal');if(x)x.remove()}
function modal(html){
 closeModal();
 const d=document.createElement('div');
 d.id='authModal'; d.className='modalBackdrop';
 d.innerHTML='<div class="modal">'+html+'</div>';
 document.body.appendChild(d);
}
function maybeOfferRegistration(){
 if(localStorage.getItem('maximum_registration_prompt_seen'))return;
 localStorage.setItem('maximum_registration_prompt_seen','1');
 modal('<h2>Добро пожаловать в «Максимум»</h2><p>Зарегистрируйтесь, чтобы пользоваться личным кабинетом и будущими бонусами приложения.</p><div class="modalActions"><button class="button outline" onclick="closeModal()">Позже</button><button class="button" onclick="showAuth(true)">Зарегистрироваться</button></div>');
}
function openAccount(){
 const u=authUser();
 if(!u)return showAuth(false);
 modal('<div class="profileCard"><div class="profileIcon">👤</div><h2>'+esc((u.user_metadata&&u.user_metadata.name)||'Пользователь')+'</h2><div class="muted">'+esc(u.email||'')+'</div><div class="modalActions" style="justify-content:center"><button class="button outline" onclick="closeModal()">Закрыть</button><button class="button" onclick="logoutAccount()">Выйти</button></div></div>');
}
function showAuth(registering){
 modal('<h2>'+(registering?'Регистрация':'Вход')+'</h2>'+
 (registering?'<input id="authName" class="field" placeholder="Имя">':'')+
 '<input id="authEmail" class="field" type="email" placeholder="E-mail">'+
 '<input id="authPass" class="field" type="password" placeholder="Пароль">'+
 (registering?'<input id="authPass2" class="field" type="password" placeholder="Повторите пароль">':'')+
 '<div id="authError" class="authError"></div>'+
 '<div class="modalActions"><button class="button outline" onclick="closeModal()">Отмена</button><button class="button" onclick="submitAuth('+registering+')">'+(registering?'Зарегистрироваться':'Войти')+'</button></div>'+
 '<div style="margin-top:12px;text-align:center"><button class="iconbtn" style="font-size:14px" onclick="showAuth('+(!registering)+')">'+(registering?'Уже есть аккаунт? Войти':'Нет аккаунта? Зарегистрироваться')+'</button></div>');
}
async function submitAuth(registering){
 const email=(document.getElementById('authEmail')?.value||'').trim();
 const password=document.getElementById('authPass')?.value||'';
 const name=(document.getElementById('authName')?.value||'').trim();
 const err=document.getElementById('authError');
 if(!email||!password||(registering&&!name)){err.textContent='Заполните обязательные поля.';return}
 if(password.length<6){err.textContent='Пароль должен быть не короче 6 символов.';return}
 if(registering&&password!==(document.getElementById('authPass2')?.value||'')){err.textContent='Пароли не совпадают.';return}
 err.textContent='Подождите…';
 try{
   let r;
   if(registering){
     r=await fetch(SUPA+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password,data:{name}})});
   }else{
     r=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
   }
   const j=await r.json();
   if(!r.ok)throw new Error(j.msg||j.message||j.error_description||'Ошибка входа');
   if(j.access_token&&j.user){
     localStorage.setItem('maximum_auth_user',JSON.stringify(j.user));
     localStorage.setItem('maximum_auth_token',j.access_token);
     closeModal(); openAccount();
   }else if(registering){
     modal('<h2>Регистрация создана</h2><p>Проверьте почту и подтвердите e-mail, затем войдите в приложение.</p><div class="modalActions"><button class="button" onclick="showAuth(false)">Перейти ко входу</button></div>');
   }
 }catch(e){err.textContent=e.message||'Не удалось выполнить вход.'}
}
function logoutAccount(){
 localStorage.removeItem('maximum_auth_user');
 localStorage.removeItem('maximum_auth_token');
 closeModal();
}

load();
</script>
</body></html>
